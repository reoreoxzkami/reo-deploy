<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>reo-deploy 動的サイト</title></head>
<body>
<h1>reo-deploy で公開した動的サイト</h1>
<p id="msg">読み込み中…</p>
<script>
fetch('/api/hello').then(r => r.json()).then(d => {
  document.getElementById('msg').textContent = d.message + ' (' + d.time + ')';
});
</script>
</body>
</html>
